  <text x="40" y="58" fill="#cbd5e1" font-size="12">Forest: atlas.local (Windows2025Forest)  |  NetBIOS: ATLAS  |  Domain Controller: ATLAS-SRV.atlas.local (10.10.20.10)</text>

